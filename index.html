<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FalaCards</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FalaCards">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --primary:#2563eb; --primary-soft:#dbeafe;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020; --card:#151b2e; --text:#e5e7eb; --muted:#9ca3af; --line:#263049;
    --primary:#60a5fa; --primary-soft:#1e3a5f;
    --ok:#4ade80; --ok-soft:#14361f; --warn:#fbbf24; --warn-soft:#3d2f0b; --bad:#f87171; --bad-soft:#3f1717;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:16px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.ghost{background:transparent;border-color:transparent;padding:8px 10px}
button.small{padding:7px 10px;font-size:14px}
button:disabled{opacity:.45}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.muted{color:var(--muted);font-size:14px}
.deck{display:flex;align-items:center;gap:12px}
.deck .info{flex:1;min-width:0}
.deck .name{font-weight:600;font-size:17px}
.pill{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;margin-right:4px}
.pill.new{background:var(--primary-soft);color:var(--primary)}
.pill.due{background:var(--ok-soft);color:var(--ok)}
.hidden{display:none!important}
.front{font-size:26px;font-weight:600;text-align:center;margin:18px 0 6px;word-wrap:break-word}
.front .w{cursor:pointer;border-radius:6px;padding:0 2px}
.front .w:active{background:var(--primary-soft)}
.back{font-size:19px;text-align:center;color:var(--muted);margin:10px 0;white-space:pre-wrap}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.mic{width:84px;height:84px;border-radius:50%;font-size:34px;background:var(--primary);color:#fff;border:0;display:block;margin:10px auto}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(220,38,38,.18)}}
.result{text-align:center}
.score{font-size:44px;font-weight:700;margin:4px 0}
.wres{font-size:21px;line-height:1.9}
.wres span{padding:1px 5px;border-radius:6px;margin:0 1px;white-space:nowrap}
.w-ok{background:var(--ok-soft);color:var(--ok)}
.w-near{background:var(--warn-soft);color:var(--warn)}
.w-bad{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.w-miss{background:var(--bad-soft);color:var(--bad);opacity:.7;text-decoration:line-through}
.heard{margin-top:8px;font-size:15px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.grades button{padding:10px 4px;font-size:14px;line-height:1.2}
.grades button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.grades button.sug{outline:3px solid var(--primary);outline-offset:1px}
.g1{color:var(--bad)} .g2{color:var(--warn)} .g3{color:var(--ok)} .g4{color:var(--primary)}
.cardline{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cardline:last-child{border-bottom:0}
.cardline .t{flex:1;min-width:0}
.cardline .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:20;max-width:90%;text-align:center}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
.legend span{padding:0 5px;border-radius:5px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.progress div{height:100%;background:var(--primary);width:0}
/* ---- Baby ---- */
.btile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:22px;padding:16px 8px;
  border:0;color:#1f2937;font-weight:700;min-height:130px}
.btile .bt-ic{font-size:56px;line-height:1.1}
.btile .bt-n{font-size:19px}
.btile .bt-p{font-size:13px;font-weight:500;opacity:.75}
.bt-home{width:100%;min-height:0;flex-direction:row;gap:12px;margin-bottom:12px;padding:14px 18px;
  background:linear-gradient(120deg,#fde68a,#fbcfe8,#bfdbfe)}
.bt-home .bt-ic{font-size:44px} .bt-home .bt-p{flex:1;text-align:left}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bgrid .btile:nth-child(1){background:#fecaca}.bgrid .btile:nth-child(2){background:#bfdbfe}
.bgrid .btile:nth-child(3){background:#fde68a}.bgrid .btile:nth-child(4){background:#bbf7d0}
.bgrid .btile:nth-child(5){background:#fbcfe8}.bgrid .btile:nth-child(6){background:#ddd6fe}
.bgrid .bt-all{grid-column:1/-1;min-height:90px;flex-direction:row;gap:12px;background:linear-gradient(90deg,#fecaca,#fde68a,#bbf7d0,#bfdbfe,#ddd6fe)}
.bstage{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:70vh}
.bstars{font-size:26px;min-height:36px;letter-spacing:2px}
.bpic{position:relative;width:min(72vw,300px);height:min(72vw,300px);display:flex;align-items:center;justify-content:center;
  background:var(--card);border-radius:36px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:visible;margin-top:6px}
.bpic-emoji{font-size:min(46vw,190px);line-height:1}
.bpic-svg{width:80%;height:80%}
.bword{font-size:34px;font-weight:800;margin-top:14px;letter-spacing:.5px}
.bstatus{font-size:44px;min-height:56px}
.bstatus.ear{animation:pulse2 .9s infinite}
.bstatus.talk{animation:wiggle .5s infinite}
.bface{font-size:56px;min-height:64px}
.bbig{width:110px;height:110px;border-radius:50%;font-size:48px;background:#22c55e;color:#fff;border:0;box-shadow:0 6px 18px rgba(34,197,94,.4)}
.bctrl{display:flex;gap:14px;margin:14px 0}
.bctrl button{font-size:28px;width:64px;height:64px;border-radius:50%;padding:0}
#bmic.glow{background:var(--primary);color:#fff;animation:pulse2 .9s infinite}
.pop{animation:pop .45s ease}
.bounce{animation:bounce .6s ease infinite}
.yay{animation:yay .8s ease}
.conf{position:absolute;top:40%;font-size:30px;animation:conf 1.3s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bounce{50%{transform:translateY(-10px)}}
@keyframes yay{30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(1.1) rotate(6deg)}100%{transform:none}}
@keyframes pulse2{50%{transform:scale(1.18)}}
@keyframes wiggle{50%{transform:rotate(12deg)}}
@keyframes conf{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-190px) scale(1.2) rotate(40deg);opacity:0}}
/* ---- Diálogos ---- */
.bt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bt-row .bt-home{margin:0;flex-direction:column;gap:2px;padding:14px 8px}
.bt-row .bt-home .bt-p{text-align:center;flex:none}
.bt-dlg{background:linear-gradient(120deg,#bae6fd,#c7d2fe,#e9d5ff)}
.dnum{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.bubble{border-radius:18px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.bubble.q{background:#fdf2f8;margin-right:28px;border-top-left-radius:4px}
.bubble.a{background:var(--card);margin-left:12px;border-top-right-radius:4px}
@media (prefers-color-scheme: dark){ .bubble.q{background:#3b1d2f} }
.bubble.talking{box-shadow:0 0 0 3px #f9a8d4}
.who{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.who .ghost{padding:2px 6px}
.qt{font-size:19px;font-weight:600}
.sent{padding:8px 10px;border-radius:12px;margin:4px -6px;border:2px solid transparent;transition:background .2s}
.sent .st{font-size:18px;line-height:1.45;cursor:pointer}
.sent.playing{background:var(--primary-soft)}
.sent.current{border-color:var(--primary);background:var(--primary-soft)}
.sent.done .st{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chips .tot{font-size:20px;margin-right:4px}
.chip{font-size:13px;padding:3px 8px;border-radius:999px;background:var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.mid{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.wres.small{font-size:16px;line-height:1.8;margin-top:6px}
.sbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dctl{display:flex;gap:8px;margin:4px 0 6px}.dctl button{flex:1}
.sbar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin-top:8px;font-size:15px}
.sbar div{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.sbar i{display:block;height:100%}
.sbar b{text-align:right}
.tip{background:var(--warn-soft);border-radius:14px;padding:10px 14px;margin:-4px 0 12px 12px;font-size:15px;line-height:1.45}
/* ---- Cartas (estudo) ---- */
.dhead{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 8px}
.deck.selmode{cursor:pointer}
.deck .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;flex:none}
.deck.sel{border-color:var(--primary)} .deck.sel .check{background:var(--primary);border-color:var(--primary)}
.felt{margin:-16px;min-height:calc(100vh - 60px);padding:14px 16px 24px;color:#eafff0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#1f8f4e 0%,#11743c 55%,#0a5a2d 100%)}
.ftop{display:flex;justify-content:space-between;font-weight:600;font-size:15px;opacity:.9;min-height:22px}
.pile{position:relative;height:min(118vw,470px);max-width:340px;margin:14px auto 0}
.pcard{position:absolute;top:0;bottom:0;left:4%;right:4%;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.pcard.down{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pcard.down::after{content:"";position:absolute;inset:7px;border-radius:10px;
  background:repeating-linear-gradient(45deg,#1d4ed8 0 6px,#2563eb 6px 12px);box-shadow:inset 0 0 0 3px #93c5fd}
.pcard.top{cursor:grab;z-index:2;perspective:1200px}
.pcard.deal{animation:deal .42s cubic-bezier(.2,.9,.3,1.15)}
@keyframes deal{0%{transform:translate(-55%,-40%) rotate(-14deg) scale(.6);opacity:.4}100%{transform:none;opacity:1}}
.pinner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.pcard.flipped .pinner{transform:rotateY(180deg)}
.pface{position:absolute;inset:0;background:#fffdf7;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 8px 22px rgba(0,0,0,.35);border:1px solid #d6d3c4;color:#1f2937;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:44px 22px;text-align:center;overflow:hidden}
.pback{transform:rotateY(180deg)}
.pc{position:absolute;font:700 20px/1.05 Georgia,serif;text-align:center}
.pc.tl{top:10px;left:12px} .pc.br{bottom:10px;right:12px;transform:rotate(180deg)}
.red{color:#c62828} .blk{color:#111827}
.psuit{position:absolute;font-size:150px;opacity:.07;pointer-events:none}
.pword{font:700 34px/1.2 -apple-system,system-ui,sans-serif;word-break:break-word;position:relative}
.pmini{font-size:15px;color:#6b7280;margin-bottom:10px}
.pdef{font-size:26px;font-weight:700;line-height:1.25}
.pex{margin-top:16px;font-size:17px;font-style:italic;color:#4b5563;line-height:1.4}
.stamp{position:absolute;top:26px;z-index:5;font:800 24px/1 -apple-system,sans-serif;padding:6px 12px;border:4px solid;border-radius:10px;
  opacity:0;pointer-events:none;letter-spacing:1px;background:rgba(255,255,255,.88)}
.stamp.yes{left:14px;color:#16a34a;transform:rotate(-14deg)} .stamp.no{right:14px;color:#dc2626;transform:rotate(14deg)}
.fbtns{display:flex;justify-content:center;gap:22px;margin-top:22px}
.fb{width:66px;height:66px;border-radius:50%;font-size:30px;padding:0;border:0;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fb.no{color:#dc2626} .fb.yes{color:#16a34a} .fb.say{width:54px;height:54px;font-size:22px;align-self:center}
.fhint{text-align:center;font-size:14px;opacity:.85;margin-top:14px}
.fdone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fdone h2{margin:8px 0 4px} .fdone p{margin:0 0 16px;opacity:.9}
.vcanvas{position:fixed;inset:0;z-index:30}
/* ---- Teleprompter ---- */
.bt-row .btile .bt-ic{font-size:38px} .bt-row .btile .bt-n{font-size:16px} .bt-row .btile .bt-p{font-size:11.5px;line-height:1.25}
.bt-tp{background:linear-gradient(120deg,#c7d2fe,#93c5fd,#a5b4fc)}
.tp-leg{margin-top:6px;font-size:15px} .lg{display:inline-block;width:22px;text-align:center;font-weight:800}
.lg.s3{color:#ef4444} .lg.s2{color:#eab308} .lg.s1{color:#22c55e} .lg.pz{color:#60a5fa}
body.fs header{display:none} body.fs main{padding:0;max-width:none}
.tp{position:fixed;inset:0;z-index:15;background:#0b1d3f;color:#fff;overflow:hidden}
.tp-scroll{position:absolute;left:0;right:0;top:0;padding:34vh 22px 70vh;text-transform:uppercase;
  font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:500;line-height:1.55;letter-spacing:.5px;will-change:transform}
.tp-q{font-size:.5em;opacity:.55;margin-bottom:1em;font-weight:600}
.tp-text{word-spacing:.12em}
.tw{transition:opacity .3s, -webkit-text-stroke .15s;border-radius:6px}
.tw.past{opacity:.38}
.tw.cur{font-weight:800;-webkit-text-stroke:1px currentColor;background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.tw .s3{color:#ff5a5a} .tw .s2{color:#ffd23f} .tw .s1{color:#4ade80}
.pz{color:#7aa2ff;opacity:.75;font-weight:400}
.tp-guide{position:absolute;left:0;top:calc(34vh - 6px);width:10px;height:calc(1.55em + 12px);border-radius:0 6px 6px 0;background:#ffd23f;opacity:.85;pointer-events:none;font-size:34px}
.tp-end{margin-top:1.4em;font-size:.55em;opacity:.85;text-transform:none}
.tp-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,14,33,.92) 40%)}
.tp-bar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 12px;font-size:16px}
.tp-bar button.wide{flex:1;max-width:150px;font-weight:600}
.tp-bar button.on{background:#dc2626;border-color:#dc2626}
</style>
</head>
<body>
<header>
  <button class="ghost hidden" id="backBtn" aria-label="Voltar">‹ Voltar</button>
  <h1 id="title">FalaCards</h1>
  <button class="ghost" id="settingsBtn" aria-label="Ajustes">⚙️</button>
</header>
<main id="app"></main>

<script>
"use strict";
/* ============ Dados ============ */
const KEY = "falacards_v1";
const LANGS = [
  ["en-US","Inglês (EUA)"],["en-GB","Inglês (Reino Unido)"],["es-ES","Espanhol (Espanha)"],
  ["es-MX","Espanhol (México)"],["fr-FR","Francês"],["it-IT","Italiano"],["de-DE","Alemão"],["pt-BR","Português"]
];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DAY = 86400000;

function sampleDeck(){
  const id = uid();
  const pairs = [
    ["Hi, how are you doing today?","Oi, como você está hoje?"],
    ["Could you repeat that, please?","Você poderia repetir, por favor?"],
    ["I'd like to schedule an appointment.","Eu gostaria de marcar um horário."],
    ["Where is the nearest pharmacy?","Onde fica a farmácia mais próxima?"],
    ["I'm looking for an apartment to rent.","Estou procurando um apartamento para alugar."],
    ["How much does it cost?","Quanto custa?"],
    ["I work as an accountant.","Eu trabalho como contador."],
    ["Can I pay with a credit card?","Posso pagar com cartão de crédito?"],
    ["Thank you so much for your help.","Muito obrigado pela sua ajuda."],
    ["What time does the store open?","Que horas a loja abre?"],
    ["I have a reservation under my name.","Tenho uma reserva no meu nome."],
    ["Nice to meet you.","Prazer em conhecer você."],
    ["through","através de"],["thought","pensamento / pensei"],["world","mundo"],["comfortable","confortável"],
  ];
  return {deck:{id,name:"Inglês – Primeiros passos",lang:"en-US"},
    cards:pairs.map(([f,b])=>newCard(id,f,b))};
}
function newCard(deckId, front, back){
  return {id:uid(),deckId,front:front.trim(),back:(back||"").trim(),
    isNew:true,due:0,interval:0,ease:2.5,reps:0,lapses:0,lastScore:null,created:Date.now()};
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.decks) return d; }catch(e){}
  const s = sampleDeck();
  return {decks:[s.deck],cards:s.cards,
    settings:{rate:0.95,newPerDay:15,voices:{},listenMode:false,autoPlay:true,strict:false},
    log:{}};
}
let DB = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("Não foi possível salvar: armazenamento cheio?"); }
}
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const today = () => new Date().toISOString().slice(0,10);
function dayLog(){ const t=today(); DB.log[t] = DB.log[t] || {newDone:0,reviews:0}; return DB.log[t]; }

/* ============ Fila de estudo ============ */
function endOfToday(){ const d=new Date(); d.setHours(23,59,59,999); return d.getTime(); }
function fmtDays(n){ if(n<30) return n+"d"; if(n<365) return (n/30).toFixed(1).replace(".0","")+" m"; return (n/365).toFixed(1)+" a"; }
function counts(deckId){
  const now = Date.now(), cs = DB.cards.filter(c=>c.deckId===deckId);
  const newLeft = Math.max(0, DB.settings.newPerDay - (dayLog().newDone||0));
  return {
    due: cs.filter(c=>!c.isNew && c.due <= endOfToday()).length,
    nu: Math.min(newLeft, cs.filter(c=>c.isNew).length),
    total: cs.length
  };
}
/* ============ Voz (texto → fala) ============ */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices(){ voices = synth ? synth.getVoices() : []; }
if (synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function voicesFor(lang){
  const base = lang.slice(0,2);
  return voices.filter(v=>v.lang.replace("_","-").startsWith(base))
    .sort((a,b)=>(b.lang.replace("_","-")===lang)-(a.lang.replace("_","-")===lang));
}
function pickVoice(lang){
  const uri = DB.settings.voices[lang];
  const list = voicesFor(lang);
  return list.find(v=>v.voiceURI===uri) || list.find(v=>/premium|enhanced|aprimorad/i.test(v.name)) || list[0] || null;
}
function speak(text, lang, rate){
  if (!synth) { toast("Este navegador não tem leitura em voz alta."); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = rate || DB.settings.rate;
  const v = pickVoice(lang); if (v) u.voice = v;
  synth.speak(u);
}

/* ============ Reconhecimento de fala ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(lang, onDone, onState){
  if (!SR){ onDone(null, "unsupported"); return; }
  if (synth) synth.cancel();
  rec = new SR();
  rec.lang = lang; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
  let got = false;
  rec.onstart = () => onState(true);
  rec.onresult = e => {
    got = true;
    const alts = [];
    const r = e.results[0];
    for (let i=0;i<r.length;i++) alts.push({text:r[i].transcript, conf:r[i].confidence});
    onDone(alts, null);
  };
  rec.onerror = e => { got = true; onState(false); onDone(null, e.error); };
  rec.onend = () => { onState(false); if(!got) onDone(null, "no-speech"); rec = null; };
  try { rec.start(); } catch(err){ onState(false); onDone(null, "start-failed"); }
}
function stopListen(){ if (rec) try{ rec.stop(); }catch(e){} }

/* ============ Avaliação da pronúncia ============ */
const CONTR = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is",
  "it's":"it is","that's":"that is","what's":"what is","there's":"there is","i'd":"i would","you'd":"you would",
  "i'll":"i will","you'll":"you will","we'll":"we will","i've":"i have","you've":"you have","we've":"we have",
  "can't":"can not","cannot":"can not","won't":"will not","don't":"do not","doesn't":"does not","didn't":"did not",
  "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","couldn't":"could not",
  "wouldn't":"would not","shouldn't":"should not","let's":"let us","gonna":"going to","wanna":"want to"};
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve",
  "thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){ // 0–100 por extenso; acima disso mantém os dígitos
  if (n < 20) return [ONES[n]];
  if (n < 100) return n % 10 ? [TENS[Math.floor(n/10)], ONES[n%10]] : [TENS[n/10]];
  if (n === 100) return ["one","hundred"];
  return [String(n)];
}
function norm(text, lang){
  let t = text.toLowerCase().replace(/[’`´]/g,"'").normalize("NFC");
  const en = lang.startsWith("en");
  if (en) t = t.replace(/&/g," and ").replace(/\$\s?(\d+)/g,"$1 dollars").replace(/%/g," percent");
  // separa letras de números (sp50c → sp 50 c) e pontuação; mantém apóstrofo dentro de palavra
  t = t.replace(/(\p{L})(\p{N})/gu,"$1 $2").replace(/(\p{N})(\p{L})/gu,"$1 $2");
  let words = t.replace(/[^\p{L}\p{N}'\s-]/gu," ").replace(/-/g," ").split(/\s+/).filter(Boolean);
  let out = [];
  for (let w of words){
    w = w.replace(/^'+|'+$/g,"");
    if (!w) continue;
    if (en && CONTR[w]) { out.push(...CONTR[w].split(" ")); continue; }
    if (en && /^\d+$/.test(w)) { out.push(...numWords(+w)); continue; }
    if (en) w = w.replace(/'s$/,"s").replace(/'/g,"");
    out.push(w);
  }
  // siglas soletradas viram uma palavra só (i p i → ipi; f p and a → fp and a)
  const merged = [];
  for (let i=0;i<out.length;){
    if (out[i].length === 1 && /\p{L}/u.test(out[i]) && i+1 < out.length && out[i+1].length === 1 && /\p{L}/u.test(out[i+1])){
      let j = i, s = "";
      while (j < out.length && out[j].length === 1 && /\p{L}/u.test(out[j])) s += out[j++];
      merged.push(s); i = j;
    } else merged.push(out[i++]);
  }
  return merged;
}
function deaccent(s){ return s.normalize("NFD").replace(/\p{M}/gu,""); }
function charSim(a,b){
  if (a===b) return 1;
  a = deaccent(a); b = deaccent(b);
  if (a===b) return 0.9;
  const m=a.length,n=b.length; if(!m||!n) return 0;
  let prev = Array.from({length:n+1},(_,j)=>j), cur = new Array(n+1);
  for (let i=1;i<=m;i++){ cur[0]=i;
    for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return 1 - prev[n]/Math.max(m,n);
}
// alinhamento palavra a palavra (Levenshtein com custo de substituição suave)
function align(target, heard){
  const m=target.length, n=heard.length;
  const D = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  const B = Array.from({length:m+1},()=>new Array(n+1).fill(""));
  for (let i=1;i<=m;i++){ D[i][0]=i; B[i][0]="del"; }
  for (let j=1;j<=n;j++){ D[0][j]=j*0.6; B[0][j]="ins"; }
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++){
    const sim = charSim(target[i-1], heard[j-1]);
    const sub = D[i-1][j-1] + (1-sim)*1.2;
    const del = D[i-1][j] + 1, ins = D[i][j-1] + 0.6;
    if (sub<=del && sub<=ins){ D[i][j]=sub; B[i][j]="sub"; }
    else if (del<=ins){ D[i][j]=del; B[i][j]="del"; }
    else { D[i][j]=ins; B[i][j]="ins"; }
  }
  const ops=[]; let i=m,j=n;
  while(i>0||j>0){
    const b=B[i][j];
    if (b==="sub"){ ops.push({t:target[i-1],h:heard[j-1],sim:charSim(target[i-1],heard[j-1])}); i--; j--; }
    else if (b==="del"){ ops.push({t:target[i-1],h:null,sim:0}); i--; }
    else { ops.push({t:null,h:heard[j-1],sim:0}); j--; }
  }
  return ops.reverse();
}
function evaluate(targetText, alts, lang){
  const target = norm(targetText, lang);
  let best = null;
  for (const a of alts){
    const heard = norm(a.text, lang);
    const ops = align(target, heard);
    let credit = 0, extra = 0;
    for (const o of ops){
      if (o.t){ credit += o.sim >= 0.999 ? 1 : (o.sim >= 0.9 ? 0.9 : (o.sim >= 0.6 ? o.sim*0.6 : 0)); }
      else extra++;
    }
    let score = target.length ? (credit/target.length)*100 : 0;
    score -= Math.min(15, extra*5);
    score = Math.max(0, Math.round(score));
    if (!best || score > best.score) best = {score, ops, heard:a.text, conf:a.conf};
  }
  return best;
}

function toast(msg, ms=2600){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
let onLeave = null; // limpeza da tela atual (microfone, áudio)
function leave(next){ if (onLeave){ const f = onLeave; onLeave = null; try{ f(next); }catch(e){} } }
function go(view, arg, replace){
  leave(view); stopListen(); if (synth) synth.cancel();
  if (!replace && stack.length) {}
  if (replace) stack[stack.length-1] = [view,arg]; else stack.push([view,arg]);
  render();
}
function back(){ leave(stack.length > 1 ? stack[stack.length-2][0] : "home"); stopListen(); if (synth) synth.cancel(); stack.pop(); if(!stack.length) stack=[["home"]]; render(); }
$back.onclick = back;
document.getElementById("settingsBtn").onclick = () => go("settings");
function render(){
  const [view,arg] = stack[stack.length-1];
  $back.classList.toggle("hidden", stack.length<=1);
  window.scrollTo(0,0);
  VIEWS[view](arg);
}

    const name = "falacards-backup-" + today() + ".json";
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:name}); return; } catch(e){ if (e.name==="AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  };
  $("imp").onclick = () => $("impFile").click();
  $("impFile").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try { const d = JSON.parse(await f.text()); if(!d.decks||!d.cards) throw 0;
      if (!confirm("Substituir todos os dados atuais pelo backup?")) return;
      DB = d; DB.settings = Object.assign(load().settings, d.settings||{}); DB.log = d.log||{}; save(); toast("Backup restaurado"); stack=[["home"]]; render();
    } catch(err){ toast("Arquivo de backup inválido."); }
  };
}
};
function langName(c){ const f = LANGS.find(l=>l[0]===c); return f ? f[1] : c; }
function stripHtml(s){ const d=new DOMParser().parseFromString(s||"","text/html"); return (d.body.textContent||"").trim(); }

window.addEventListener("load", () => { if (typeof syncBundled === "function") syncBundled(); stack = [["home"]]; render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && stack[stack.length-1][0]==="home") render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
